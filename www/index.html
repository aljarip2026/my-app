<!DOCTYPE html>
<html lang="en">
<head><script>
// إصلاح الحفظ في APK: قاعدة بيانات محلية كاملة بدل السيرفر
// يعترض طلبات actions ويحفظ في localStorage: زبون، سند قبض/صرف، صنف، بيع، شراء، وكل العمليات
(function(){
  var KEY='ibn_local_db_v2';
  function loadDB(){ try{ var d=JSON.parse(localStorage.getItem(KEY)||'{}'); if(!d || typeof d!=='object') return {}; return d; }catch(e){ return {}; } }
  function saveDB(db){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){} }
  function ok(data){ return Promise.resolve(new Response(JSON.stringify({data:data}),{status:200,headers:{'Content-Type':'application/json'}})); }
  function handleActions(body){
    var db=loadDB();
    var action=body && body.action;
    var args=body && body.args || {};
    var col=args.collection || 'items';
    if(!db[col]) db[col]=[];
    var list=db[col];
    if(action==='records.list'){
      return ok({records: list.slice()});
    }
    if(action==='records.create'){
      // منع التكرار بنفس idempotency_key (مثل إعدادات الترحيب)
      if(args.idempotency_key){
        var ex=null;
        for(var i=0;i<list.length;i++){ if(list[i] && list[i].idempotency_key===args.idempotency_key){ ex=list[i]; break; } }
        if(ex) return ok({id: ex.id, value: ex.value, idempotency_key: ex.idempotency_key});
      }
      var id = args.id || ('id_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,9));
      var rec={id:id, value: args.value};
      if(args.idempotency_key) rec.idempotency_key=args.idempotency_key;
      // احفظ أي حقول إضافية مهمة
      if(args.collection) rec.collection=args.collection;
      list.push(rec);
      saveDB(db);
      return ok({id:id, value: args.value});
    }
    if(action==='records.replace'){
      var idx=-1;
      for(var j=0;j<list.length;j++){ if(list[j] && String(list[j].id)===String(args.id)){ idx=j; break; } }
      if(idx>=0){ list[idx].value=args.value; if(args.idempotency_key) list[idx].idempotency_key=args.idempotency_key; }
      else { list.push({id:args.id, value:args.value, idempotency_key:args.idempotency_key}); }
      saveDB(db);
      return ok({id:args.id, value:args.value});
    }
    if(action==='records.delete'){
      db[col]=list.filter(function(r){ return r && String(r.id)!==String(args.id); });
      saveDB(db);
      return ok({ok:true, id:args.id});
    }
    // أي action آخر: رد نجاح فارغ حتى لا يتعطل التطبيق
    return ok({});
  }
  var origFetch=window.fetch;
  window.fetch=function(url, opts){
    try{
      var u = (typeof url==='string') ? url : (url && url.url ? String(url.url) : '');
      var method = (opts && opts.method || (url && url.method) || 'GET').toUpperCase();
      // طلبات الحفظ الأصلية: fetch("actions", {method:"POST", body:{action,args}})
      if(u==='actions' || u.indexOf('/actions')!==-1 || u.indexOf('actions')!==-1 && u.indexOf('http')===-1){
        if(method==='POST'){
          var raw = opts && opts.body || (url && url.body) || '{}';
          var body = (typeof raw==='string') ? JSON.parse(raw) : raw;
          return handleActions(body);
        }
      }
      // توافق مع الشيم القديم: /records
      if(u.indexOf('/records')!==-1 || u.indexOf('records')!==-1 && u.indexOf('actions')===-1){
        var db2=loadDB();
        if(method==='GET'){
          var m=u.match(/collection=([^&]+)/); var c=m?decodeURIComponent(m[1]):'items';
          return ok({records: (db2[c]||[]).slice()});
        }
      }
    }catch(e){}
    return origFetch.apply(this, arguments);
  };
  // إخفاء رسائل الاتصال فقط، بدون إخفاء رسائل النجاح
  var style=document.createElement('style');
  style.textContent='[data-toast].toast-error,.toast-error{display:none!important}';
  document.addEventListener('DOMContentLoaded',function(){document.head.appendChild(style);});
})();
</script>
